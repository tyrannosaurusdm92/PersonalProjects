<!doctype html><meta charset="utf-8"><title>Video playback diagnostics</title><style>body{background:#111;color:white;font:17px monospace}video{width:45%;max-height:50vh}button{font-size:22px;padding:12px}</style><h1>Video playback diagnostics</h1><button id="start">Test with sound</button><button id="muted">Test muted</button><div id="result"></div><div><strong>Source 1</strong><video playsinline preload="metadata" id="v0" src="https://drive.google.com/uc?export=download&id=138avEK_vifSnFniKcBtIzr0fYDfXSX98"></video></div><div><strong>Source 2</strong><video playsinline preload="metadata" id="v1" src="https://drive.usercontent.google.com/download?id=138avEK_vifSnFniKcBtIzr0fYDfXSX98&export=download&confirm=t"></video></div><script>const log=t=>document.getElementById('result').innerHTML+=' <p>'+t+'</p>';const vs=[document.getElementById('v0'),document.getElementById('v1')];vs.forEach((v,i)=>{for(const ev of ['loadstart','loadedmetadata','canplay','playing','timeupdate','ended','error','stalled'])v.addEventListener(ev,()=>log('Source '+(i+1)+' '+ev+' time '+v.currentTime.toFixed(2)+' duration '+v.duration+' err '+(v.error?.code||'')))});for(const id of ['start','muted'])document.getElementById(id).onclick=()=>vs.forEach((v,i)=>{v.muted=id==='muted';v.play().then(()=>log('Source '+(i+1)+' play granted'),e=>log('Source '+(i+1)+' play failed '+e.message))});</script>
