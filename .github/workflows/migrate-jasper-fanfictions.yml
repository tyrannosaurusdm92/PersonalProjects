name: Migrate Jasper fanfiction library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-jasper-fanfictions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jasper-book-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Retrieve source Jasper directory
        shell: bash
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/tyrannosaurusdm92/An_Admins_Place.git /tmp/jasper-source
          git -C /tmp/jasper-source sparse-checkout set PersonalProjects/Jasper
          test -f /tmp/jasper-source/PersonalProjects/Jasper/index.html
          test -f /tmp/jasper-source/PersonalProjects/Jasper/js/fanfic-data.js

      - name: Copy entire directory and validate chapter counts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Jasper/Book
          rm -f Jasper/Book/placeholder.html
          cp -a /tmp/jasper-source/PersonalProjects/Jasper/. Jasper/Book/
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime
          root=Path("Jasper/Book")
          chapters=sorted(p for p in (root/"json").glob("*/*/[0-9][0-9].json"))
          series=sorted((root/"json").glob("*/*/series.json"))
          assert len(chapters)==200, f"Expected 200 chapters; got {len(chapters)}"
          assert len(series)==5, f"Expected five stories; got {len(series)}"
          assert (root/"index.html").exists()
          assert (root/"js/fanfic-data.js").stat().st_size>1000000
          for p in chapters:
            obj=json.loads(p.read_text(encoding="utf-8"))
            assert obj.get("format")=="linear_first_person_reader_insert", str(p)
            assert obj.get("rating")=="Teen", str(p)
            assert len(obj.get("content",""))>500, str(p)
          for p in series:
            obj=json.loads(p.read_text(encoding="utf-8"))
            assert len(obj["chapters"])==40, str(p)
          all_files=[p for p in root.rglob("*") if p.is_file()]
          report=[
            "# Jasper Book — Step 2 migration record",
            "",
            "Copied the complete source Jasper directory to `Jasper/Book` using the repository-side migration workflow.",
            f"Files copied: **{len(all_files)}**",
            f"Authored fanfiction chapters: **{len(chapters)}**",
            f"Series manifests: **{len(series)}**",
            "All five series were preserved with 40 sequential chapters each.",
            "Content, HTML, CSS, JS, JSON, documentation, images and audio retained.",
            "Source deletion is a separate operation after destination verification.",
            "",
            "## Reader",
            "Open `Jasper/Book/index.html` in the deployed PersonalProjects GitHub Pages site.",
            ""
          ]
          (root/"docs/STEP_2_MIGRATION.md").write_text("\n".join(report),encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Commit migration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Jasper/Book/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move complete Jasper fanfiction reader and source library into Jasper/Book"
            git push origin HEAD:main
          fi
