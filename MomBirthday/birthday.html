<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#32174D">
  <meta name="description" content="A photo tribute for Mom’s 63rd birthday, with memories of Dad, Jo, Boo and Annie.">
  <title>For Mom · Happy 63rd Birthday</title>
  <link rel="stylesheet" href="css/birthday.css">
  <link rel="preload" href="assets/images/p000.jpg" as="image">
  <script defer src="js/photo-data.js"></script>
  <script defer src="js/audio-energy.js"></script>
  <script defer src="js/aurora.js"></script>
  <script defer src="js/floral-effects.js"></script>
  <script defer src="js/montage.js"></script>
</head>
<body class="not-loaded">
  <canvas id="aurora" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="edge-aurora" aria-hidden="true"></div>
  <div class="petal-field" id="petal-field" aria-hidden="true"></div>
  <main id="experience" class="experience" aria-label="Birthday photo montage">
    <header class="masthead" id="masthead">
      <div class="identity"><span class="tiny-flower" aria-hidden="true">✦</span><span class="eyebrow">For Mom</span><span class="dot">·</span><span class="eyebrow">63 beautiful years</span></div>
      <div class="now-playing"><span id="track-number">01 / 03</span><span class="track-divider">·</span><span id="song-label">Für Elise</span></div>
    </header>
    <div class="theater" id="theater">
      <div class="photo-stage" id="photo-stage" role="img" aria-label="Family memories">
        <div class="photo-layer" id="layer-0" aria-hidden="true"><div class="photo-backdrop"></div><img class="photo-front" alt="" decoding="async" fetchpriority="high"></div>
        <div class="photo-layer" id="layer-1" aria-hidden="true"><div class="photo-backdrop"></div><img class="photo-front" alt="" decoding="async"></div>
        <div class="photo-vignette" aria-hidden="true"></div>
        <div class="filament filament-a" aria-hidden="true"></div><div class="filament filament-b" aria-hidden="true"></div>
        <div id="chapter-shimmer" class="chapter-shimmer" aria-hidden="true"></div>
        <div class="photo-caption" id="photo-caption" aria-live="off"><span class="caption-line" id="caption-title"></span><span class="caption-subline" id="caption-subtitle"></span></div>
        <div class="chapter-title" id="chapter-title" aria-hidden="true"></div>
      </div>
      <div class="side-blooms side-blooms-left" aria-hidden="true"></div><div class="side-blooms side-blooms-right" aria-hidden="true"></div>
      <div class="floral-corner floral-corner-left" aria-hidden="true"><div class="mini-flower"><span class="mini-petal p1"></span><span class="mini-petal p2"></span><span class="mini-petal p3"></span><span class="mini-petal p4"></span><span class="mini-center"></span><span class="mini-stem"></span></div></div>
      <div class="floral-corner floral-corner-right" aria-hidden="true"><div class="mini-flower"><span class="mini-petal p1"></span><span class="mini-petal p2"></span><span class="mini-petal p3"></span><span class="mini-petal p4"></span><span class="mini-center"></span><span class="mini-stem"></span></div></div>
    </div>
    <footer class="player" id="player">
      <div class="progress-row"><span class="clock" id="elapsed">00:00</span><input type="range" min="0" max="834" step="0.1" value="0" id="scrub" aria-label="Seek through birthday montage"><span class="clock" id="remaining">13:54</span></div>
      <div class="controls">
        <div class="control-left"><span class="memory-count" id="memory-count">177 memories</span></div>
        <div class="control-center"><button type="button" id="back-btn" class="icon-btn" title="Go back ten seconds" aria-label="Go back ten seconds">↶ <small>10</small></button><button type="button" id="toggle-btn" class="play-btn" title="Pause" aria-label="Pause"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path id="play-icon" fill="currentColor" d="M8 5v14l11-7z"/></svg></button><button type="button" id="next-btn" class="icon-btn" title="Go forward ten seconds" aria-label="Go forward ten seconds">↷ <small>10</small></button></div>
        <div class="control-right"><button type="button" id="sound-btn" class="text-btn" aria-label="Mute audio" title="Mute audio">Sound on</button><button type="button" id="fullscreen-btn" class="text-btn" aria-label="Enter fullscreen" title="Fullscreen">Fullscreen <span aria-hidden="true">⛶</span></button></div>
      </div>
    </footer>
    <div class="intro" id="intro">
      <div class="intro-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="intro-content"><div class="intro-kicker">October 11, 2026</div><h1>Happy 63rd<br><em>Birthday, Mom.</em></h1><div class="intro-rule" aria-hidden="true"></div><p>A lifetime of love. A thousand little moments.</p><button type="button" class="begin-btn" id="begin-btn">Watch your memories <span aria-hidden="true">→</span></button></div>
      <div class="intro-bottom">With love, always.</div>
    </div>
    <div class="outro" id="outro" aria-hidden="true"><div class="outro-inner"><span class="outro-decoration" aria-hidden="true">✦</span><div class="outro-overline">October 11, 2026</div><h2>Happy 63rd Birthday, Mom.</h2><p>With love, always.</p><button type="button" class="replay-btn" id="replay-btn">Watch again ↻</button></div></div>
  </main>
  <noscript><p class="no-script">Enable JavaScript to enjoy the birthday montage.</p></noscript>
</body>
</html>
