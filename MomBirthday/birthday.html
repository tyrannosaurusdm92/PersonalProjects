<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#190e29">
  <meta name="description" content="Happy 63rd Birthday, Mom, I hope it's as amazing as you!">
  <title>Happy 63rd Birthday, Mom</title>
  <link rel="stylesheet" href="css/birthday.css">
  <script defer src="js/photo-data.js"></script>
  <script defer src="js/audio-energy.js"></script>
  <script defer src="js/aurora.js"></script>
  <script defer src="js/edge-aurora.js"></script>
  <script defer src="js/floral-effects.js"></script>
  <script defer src="js/montage.js"></script>
</head>
<body>
  <main id="experience" class="experience" aria-label="Birthday photo tribute">
    <canvas id="aurora" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="aurora-border" aria-hidden="true"></div>
    <canvas id="aurora-edges" aria-hidden="true"></canvas>
    <div id="petal-field" class="petal-field" aria-hidden="true"></div>

    <header class="masthead">
      <div class="identity"><span class="small-star" aria-hidden="true">✧</span><span>For Mom</span><span class="middle-dot">·</span><span>October 11, 1963</span></div>
      <div class="now-playing"><span id="track-number">01 / 03</span><span class="middle-dot">·</span><span id="song-label">Canon in D</span></div>
    </header>

    <section class="theater" aria-label="Family photographs">
      <div class="photo-stage" id="photo-stage" role="img" aria-label="Family photograph">
        <div class="photo-layer" id="layer-0" aria-hidden="true"><div class="photo-backdrop"></div><img class="photo-front" alt="" decoding="async"></div>
        <div class="photo-layer" id="layer-1" aria-hidden="true"><div class="photo-backdrop"></div><img class="photo-front" alt="" decoding="async"></div>
        <div class="photo-vignette" aria-hidden="true"></div>
        <div class="photo-aurora-wash" id="photo-transition" aria-hidden="true"></div>
      </div>
    </section>

    <footer class="player" id="player">
      <div class="progress-row"><span class="clock" id="elapsed">00:00</span><input type="range" min="0" max="817" step="0.1" value="0" id="scrub" aria-label="Seek in tribute"><span class="clock" id="remaining">13:37</span></div>
      <div class="controls">
        <div class="control-left"><span class="footer-note">With love, always</span></div>
        <div class="control-center">
          <button type="button" id="back-btn" class="icon-btn" title="Back 10 seconds" aria-label="Back 10 seconds">↶<small>10</small></button>
          <button type="button" id="toggle-btn" class="play-btn" title="Play" aria-label="Play"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path id="play-icon" fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
          <button type="button" id="next-btn" class="icon-btn" title="Forward 10 seconds" aria-label="Forward 10 seconds">↷<small>10</small></button>
        </div>
        <div class="control-right"><button type="button" id="sound-btn" class="text-btn" aria-label="Mute audio">Sound</button><button type="button" id="fullscreen-btn" class="text-btn" aria-label="Enter fullscreen">Fullscreen <span aria-hidden="true">⛶</span></button></div>
      </div>
    </footer>

    <div class="intro" id="intro">
      <div class="intro-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="intro-content"><div class="date">October 11, 1963</div><h1>Happy 63rd<br><em>Birthday, Mom.</em></h1><div class="intro-rule" aria-hidden="true"></div><p>With all my love, Bunny</p><button type="button" class="begin-btn" id="begin-btn">Begin <span aria-hidden="true">→</span></button></div>
    </div>
    <div class="outro" id="outro" aria-hidden="true"><div class="outro-content"><div class="date">October 11, 2026</div><h2>Happy 63rd Birthday, Mom.</h2><p>With all my love, Bunny</p><button type="button" class="begin-btn" id="replay-btn">Watch again <span aria-hidden="true">↻</span></button></div></div>

    <div class="floral-edges" aria-hidden="true">
      <img class="floral-spray spray-left" src="assets/images/birthday-bouquet.svg" alt="" decoding="async">
      <img class="floral-spray spray-right" src="assets/images/birthday-bouquet.svg" alt="" decoding="async">
    </div>
    <noscript><p class="no-script">Enable JavaScript to play the tribute.</p></noscript>
  </main>
</body>
</html>
